name: iFakeHealth
options:
  bundleIdPrefix: dev.efebagri
  deploymentTarget:
    iOS: "17.0"

targets:
  iFakeHealth:
    type: application
    platform: iOS
    sources:
      - path: iFakeHealth
    info:
      path: iFakeHealth/Info.plist
      properties:
        NSHealthShareUsageDescription: "Not used for reading, only required to enable Health write access."
        NSHealthUpdateUsageDescription: "Writes step, distance and energy samples to Health."
        UILaunchScreen: {}
    entitlements:
      path: iFakeHealth/iFakeHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.efebagri.iFakeHealth
        PRODUCT_NAME: iFakeHealth
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VUYRL5P53H
